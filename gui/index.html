<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideas on X</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      color: #1b1b1b;
      background: #f4f3ef;
    }
    header {
      padding: 18px 22px 8px;
      border-bottom: 1px solid #ddd8cc;
      background: #fffdf8;
    }
    h1 { font-size: 18px; margin: 0 0 12px; font-weight: 650; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    input[type="search"], input[type="text"], input[type="date"], select {
      font: inherit;
      padding: 7px 9px;
      border: 1px solid #c9c3b6;
      border-radius: 6px;
      background: #fff;
    }
    input[type="search"] { flex: 1 1 280px; min-width: 200px; }
    button {
      font: inherit;
      padding: 7px 14px;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #4b5563; }
    button:disabled { opacity: .55; cursor: wait; }
    label.chk { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; }
    .hint { color: #666; font-size: 12px; margin: 0 0 6px; }
    .stats { color: #444; font-size: 13px; margin: 6px 0 0; }
    .toast { color: #9a3412; font-size: 13px; min-height: 1.2em; }
    main { padding: 14px 22px 40px; max-width: 820px; }
    .card {
      background: #fff;
      border: 1px solid #e4dfd4;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .meta { color: #555; font-size: 13px; margin-bottom: 4px; }
    .summary { margin: 4px 0; }
    .kw { color: #555; font-size: 12px; }
    .snip { color: #333; font-size: 13px; margin-top: 6px; }
    a { color: #1d4ed8; }
    .empty { color: #666; padding: 24px 0; }
    .flags { font-size: 11px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Ideas on X</h1>
    <form id="f">
      <div class="row">
        <input type="search" id="q" name="q" placeholder="idea, topic, or FTS query" autocomplete="off">
        <button type="submit">Search</button>
        <button type="button" class="secondary" id="interpret">Interpret</button>
      </div>
      <p class="hint">Search is free FTS5. Multiple words are AND — use OR between alternatives. Interpret fills the form from a sentence (OpenRouter).</p>
      <div class="row">
        <label>From <input type="date" id="date_from"></label>
        <label>To <input type="date" id="date_to"></label>
        <label class="chk"><input type="checkbox" id="include_undated" checked> Include undated</label>
        <label class="chk"><input type="checkbox" id="enriched_only"> Enriched only</label>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" class="type" value="bookmark" checked> Bookmark</label>
        <label class="chk"><input type="checkbox" class="type" value="post" checked> Post</label>
        <label class="chk"><input type="checkbox" class="type" value="reply" checked> Reply</label>
        <label class="chk"><input type="checkbox" class="type" value="repost" checked> Repost</label>
        <label class="chk"><input type="checkbox" class="type" value="like" checked> Like</label>
        <label>Category
          <select id="category"><option value="">All</option></select>
        </label>
      </div>
      <div class="row">
        <label>Author <input type="text" id="author" placeholder="handle"></label>
        <label>Hits <input type="range" id="limit" min="10" max="100" step="5" value="25"> <span id="limitn">25</span></label>
        <label>Sort
          <select id="sort">
            <option value="relevance">Relevance</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </label>
      </div>
    </form>
    <p class="stats" id="stats"></p>
    <p class="toast" id="toast"></p>
  </header>
  <main id="results"></main>
  <script>
    const $ = (id) => document.getElementById(id);
    $("limit").addEventListener("input", () => { $("limitn").textContent = $("limit").value; });

    function selectedTypes() {
      return [...document.querySelectorAll(".type:checked")].map((el) => el.value);
    }

    function paramsFromForm() {
      const p = new URLSearchParams();
      const q = $("q").value.trim();
      if (q) p.set("q", q);
      if ($("date_from").value) p.set("date_from", $("date_from").value);
      if ($("date_to").value) p.set("date_to", $("date_to").value);
      p.set("include_undated", $("include_undated").checked ? "true" : "false");
      p.set("enriched_only", $("enriched_only").checked ? "true" : "false");
      if ($("author").value.trim()) p.set("author", $("author").value.trim());
      if ($("category").value) p.set("category", $("category").value);
      p.set("limit", $("limit").value);
      p.set("sort", $("sort").value);
      selectedTypes().forEach((t) => p.append("types", t));
      return p;
    }

    function flagBits(r) {
      const bits = [];
      if (r.is_bookmark) bits.push("bookmark");
      if (r.is_post) bits.push("post");
      if (r.is_reply) bits.push("reply");
      if (r.is_repost) bits.push("repost");
      if (r.is_like) bits.push("like");
      return bits.join(" · ");
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function loadStats() {
      const st = await (await fetch("/api/stats")).json();
      $("stats").textContent =
        `${st.total} in db · ${st.enriched} enriched · ${st.undated} undated · ` +
        `bookmarks ${st.is_bookmark} · posts ${st.is_post} · replies ${st.is_reply} · ` +
        `reposts ${st.is_repost} · likes ${st.is_like}`;
      const sel = $("category");
      const keep = sel.value;
      sel.innerHTML = '<option value="">All</option>';
      (st.categories || []).forEach((c) => {
        const o = document.createElement("option");
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      if (keep) sel.value = keep;
    }

    async function search() {
      $("toast").textContent = "";
      const p = paramsFromForm();
      const data = await (await fetch("/api/search?" + p.toString())).json();
      const box = $("results");
      if (!data.rows || !data.rows.length) {
        box.innerHTML = '<p class="empty">no hits</p>';
        return;
      }
      box.innerHTML = data.rows.map((r) => {
        const when = (r.created_at || "?").slice(0, 10);
        const who = r.author_username ? "@" + r.author_username : "@_";
        const cat = r.bookmark_category ? ` · ${esc(r.bookmark_category)}` : "";
        const sum = r.summary ? `<div class="summary">${esc(r.summary)}</div>` : "";
        const kw = r.keywords ? `<div class="kw">${esc(r.keywords)}</div>` : "";
        const snip = r.snippet ? `<div class="snip">${esc(r.snippet)}</div>` : "";
        const href = r.url || ("https://x.com/i/web/status/" + r.id);
        return `<article class="card">
          <div class="meta">${esc(when)} · ${esc(who)}${cat}
            <span class="flags"> · ${esc(flagBits(r))}</span></div>
          ${sum}${kw}${snip}
          <div><a href="${esc(href)}" target="_blank" rel="noopener">Open on X</a></div>
        </article>`;
      }).join("");
    }

    $("f").addEventListener("submit", (e) => { e.preventDefault(); search(); });

    $("interpret").addEventListener("click", async () => {
      const sentence = $("q").value.trim();
      if (!sentence) { $("toast").textContent = "Type a sentence first."; return; }
      $("interpret").disabled = true;
      $("toast").textContent = "Interpreting…";
      try {
        const res = await fetch("/api/interpret", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sentence })
        });
        if (!res.ok) {
          $("toast").textContent = res.status === 503 ? "Interpret unavailable." : "Interpret failed.";
          return;
        }
        const out = await res.json();
        if (out.q != null) $("q").value = out.q;
        if (out.date_from) $("date_from").value = String(out.date_from).slice(0, 10);
        if (out.date_to) $("date_to").value = String(out.date_to).slice(0, 10);
        if (typeof out.include_undated === "boolean") $("include_undated").checked = out.include_undated;
        if (typeof out.enriched_only === "boolean") $("enriched_only").checked = out.enriched_only;
        if (out.author != null) $("author").value = out.author;
        if (out.category != null) $("category").value = out.category;
        if (out.limit) { $("limit").value = out.limit; $("limitn").textContent = out.limit; }
        if (out.sort) $("sort").value = out.sort;
        if (Array.isArray(out.types) && out.types.length) {
          document.querySelectorAll(".type").forEach((el) => {
            el.checked = out.types.includes(el.value);
          });
        }
        $("toast").textContent = "";
        await search();
      } catch (err) {
        $("toast").textContent = "Interpret failed.";
      } finally {
        $("interpret").disabled = false;
      }
    });

    loadStats().then(search);
  </script>
</body>
</html>
